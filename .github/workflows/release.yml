name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the tag matches the version in build.gradle
        run: grep -Fq "version = '${GITHUB_REF_NAME}'" build.gradle

      - name: Set up JDK 8 and JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: gradle

      - name: Run tests and publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >-
          ./gradlew test publishPlugins --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64
